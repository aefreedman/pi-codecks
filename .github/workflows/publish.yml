name: Publish npm Package

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Trusted npm publication
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run credential-free tests
        run: npm test

      - name: Validate and smoke-test package
        run: |
          npm run pack:validate
          npm run pack:smoke
          npm run pack:dry-run
          npm publish --dry-run --access public --ignore-scripts

      - name: Verify release identity and publication state
        id: release_identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          expected_git_head=$(git rev-parse HEAD)
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Release tag must be ${expected_tag}; received ${RELEASE_TAG}."
            exit 1
          fi

          metadata_file=$(mktemp)
          error_file=$(mktemp)
          if npm view "${package_name}@${package_version}" version gitHead --json >"$metadata_file" 2>"$error_file"; then
            observed_version=$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.version))" "$metadata_file")
            observed_git_head=$(node -e "const d=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(d.gitHead))" "$metadata_file")
            rm -f "$metadata_file" "$error_file"
            if [[ "$observed_version" != "$package_version" || "$observed_git_head" != "$expected_git_head" ]]; then
              echo "::error::Existing npm identity does not match ${expected_tag}: version=${observed_version}, gitHead=${observed_git_head}, expectedGitHead=${expected_git_head}."
              exit 1
            fi
            echo "publish_required=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} already exists with the exact release gitHead; publication is complete."
            exit 0
          fi
          rm -f "$metadata_file"
          if ! grep -q "E404" "$error_file"; then
            echo "::error::Unable to verify whether ${package_name}@${package_version} exists on npm."
            cat "$error_file"
            rm -f "$error_file"
            exit 1
          fi
          rm -f "$error_file"
          echo "publish_required=true" >> "$GITHUB_OUTPUT"
          echo "Release tag matches the package version and the version is not published."

      - name: Publish with provenance through npm trusted publishing
        if: steps.release_identity.outputs.publish_required == 'true'
        run: npm publish --access public --provenance
